<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Radial & Linear Glow Gradients -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00F0FF" />
      <stop offset="50%" stopColor="#0EA5E9" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <linearGradient id="glowBackdrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B1528" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Cyber Shield Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#glowBackdrop)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="6" />
  
  <!-- Subtle Background Tech Grid -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" stroke="rgba(255, 255, 255, 0.03)" stroke-width="2" />

  <!-- Outer Hexagonal Tech Frame -->
  <polygon points="256,68 412,158 412,354 256,444 100,354 100,158" fill="rgba(0, 240, 255, 0.02)" stroke="rgba(0, 240, 255, 0.15)" stroke-width="3" />

  <!-- The Stylized Circuit-Node 'H' Monogram -->
  <!-- Glow Layer -->
  <g filter="url(#neonGlow)" opacity="0.85">
    <!-- Left Vertical Pillar -->
    <path d="M168 136v240" stroke="url(#cyberNeon)" stroke-width="28" stroke-linecap="round" />
    <!-- Right Vertical Pillar -->
    <path d="M344 136v240" stroke="url(#cyberNeon)" stroke-width="28" stroke-linecap="round" />
    <!-- Center Horizontal Crossbar with Stepped Circuit Routing -->
    <path d="M168 256h176" stroke="url(#cyberNeon)" stroke-width="28" stroke-linecap="round" />
    <!-- Diagonal Circuit Traces -->
    <path d="M168 136l88 60 88-60" stroke="#00F0FF" stroke-width="12" stroke-linejoin="round" fill="none" />
    <path d="M168 376l88-60 88 60" stroke="#10B981" stroke-width="12" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Sharp Foreground Layer -->
  <g filter="url(#subtleGlow)">
    <!-- Main 'H' Structure -->
    <path d="M168 136v240" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    <path d="M344 136v240" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    <path d="M168 256h176" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />

    <!-- Circuit Interconnection Dots (Golden/Cyan Micro-Nodes) -->
    <!-- Top Left Node -->
    <circle cx="168" cy="136" r="24" fill="#030712" stroke="#00F0FF" stroke-width="8" />
    <circle cx="168" cy="136" r="10" fill="#00F0FF" />

    <!-- Bottom Left Node -->
    <circle cx="168" cy="376" r="24" fill="#030712" stroke="#10B981" stroke-width="8" />
    <circle cx="168" cy="376" r="10" fill="#10B981" />

    <!-- Top Right Node -->
    <circle cx="344" cy="136" r="24" fill="#030712" stroke="#00F0FF" stroke-width="8" />
    <circle cx="344" cy="136" r="10" fill="#00F0FF" />

    <!-- Bottom Right Node -->
    <circle cx="344" cy="376" r="24" fill="#030712" stroke="#10B981" stroke-width="8" />
    <circle cx="344" cy="376" r="10" fill="#10B981" />

    <!-- Central Neural Core Nexus Node -->
    <circle cx="256" cy="256" r="32" fill="#030712" stroke="#38BDF8" stroke-width="8" />
    <circle cx="256" cy="256" r="16" fill="url(#cyberNeon)" />
    <circle cx="256" cy="256" r="7" fill="#FFFFFF" />

    <!-- Orbiting Accent Satellites -->
    <circle cx="256" cy="196" r="8" fill="#00F0FF" />
    <circle cx="256" cy="316" r="8" fill="#10B981" />
  </g>
</svg>
